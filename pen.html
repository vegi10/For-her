        <p class="story-intro">
            You may not remember this.
        </p>

    <section class="pen-section">

        <div class="pen-photo">

            <img src="../images/pen.jpg"

                First year examination lo,
                I gave you this pen.
            </p>

            <p>
                For you, maybe it was just a pen.
            </p>

            <p class="large-story">
                But I still have it.
            </p>

                Maybe it sounds silly.
                But I couldn't throw it away.
            </p>
